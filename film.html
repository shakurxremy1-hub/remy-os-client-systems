  function tone(t) { var m = ease(cl((t - (SEC.problem.start - .3)) / .6)) * (1 - ease(cl((t - FIX) / .5))); return mix(GOLD, EMBER, m); }
  function envAt(t) { var i = Math.max(0, Math.min(TL.env.length - 1, Math.floor(t * 30))); return TL.env[i]; }
  var BEAT = 60 / 96, KICK0 = SEC.intro.start - .2;
  function pulse(t) { if (t < KICK0) return 0; var k = ((t - KICK0) % BEAT); return Math.exp(-k * 7); }
  var IMPACTS = [SEC.intro.start, FIX, SEC.cta.start, tm('cta.2')];
  function flashAt(t) { var f = 0; IMPACTS.forEach(function (ti) { if (t >= ti) f = Math.max(f, Math.exp(-(t - ti) * 5.5)); }); return f; }
  var WIPES = [SEC.intro.start, SEC.problem.start, SEC.build.start, SEC.cta.start];

  function drawFx(t, col) {
    fx.clearRect(0, 0, 1920, 1080);
    var link = 240, e = envAt(t), c = col[0] + ',' + col[1] + ',' + col[2];
    var P = [];
    for (var i = 0; i < NODES.length; i++) { var n = NODES[i]; P.push([((n.x + n.vx * t) % 1920 + 1920) % 1920, ((n.y + n.vy * t) % 1080 + 1080) % 1080, n]); }
    fx.lineWidth = 1.4;
    for (i = 0; i < P.length; i++) for (var j = i + 1; j < P.length; j++) {
      var dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1]; if (dx > link || dx < -link || dy > link || dy < -link) continue;
      var d = Math.sqrt(dx * dx + dy * dy); if (d < link) { fx.strokeStyle = 'rgba(' + c + ',' + ((1 - d / link) * (.45 + .35 * e)).toFixed(3) + ')'; fx.beginPath(); fx.moveTo(P[i][0], P[i][1]); fx.lineTo(P[j][0], P[j][1]); fx.stroke(); }
    }
    for (i = 0; i < P.length; i++) {
      var nn = P[i][2], tw = .65 + .35 * Math.sin(t * 2.2 + nn.p);
      if (nn.r > 3) { fx.fillStyle = 'rgba(' + c + ',.16)'; fx.beginPath(); fx.arc(P[i][0], P[i][1], nn.r * 5, 0, 6.28); fx.fill(); }
      fx.fillStyle = 'rgba(' + c + ',' + (.8 * tw).toFixed(3) + ')'; fx.beginPath(); fx.arc(P[i][0], P[i][1], nn.r, 0, 6.28); fx.fill();
    }
  }
  function drawRing(t, col) {
    ringC.clearRect(0, 0, 640, 640); var e = envAt(t), N = 84, c = col[0] + ',' + col[1] + ',' + col[2];
    for (var i = 0; i < N; i++) {
      var ang = i / N * 6.2832 - 1.5708, nz = Math.sin(i * 12.9898 + t * 7.3) * .5 + .5, lv = e * (.45 + .55 * nz) + .05 * Math.sin(t * 3 + i);
      var r0 = 118, r1 = r0 + 6 + lv * 62; ringC.strokeStyle = 'rgba(' + c + ',' + (.45 + .5 * lv).toFixed(3) + ')'; ringC.lineWidth = 5; ringC.lineCap = 'round';
      ringC.beginPath(); ringC.moveTo(320 + Math.cos(ang) * r0, 320 + Math.sin(ang) * r0 + 0); ringC.lineTo(320 + Math.cos(ang) * r1, 320 + Math.sin(ang) * r1); ringC.stroke();
    }
  }

  /* ---------- captions ---------- */
  var CAPS = [];
  TL.sections.forEach(function (s) {
    s.sentences.forEach(function (sn, si) {
      var on = s.id === 'build';
      if (!on) return; var ws = sn.words, k = Math.ceil(ws.length / 3), per = Math.ceil(ws.length / k);
      for (var i = 0; i < ws.length; i += per) { var ch = ws.slice(i, i + per); CAPS.push({ t0: ch[0].t0 - .05, t1: ch[ch.length - 1].t1 + .22, ws: ch }); }
    });
  });
  var capIdx = -2;
  function drawCaps(t) {
    var idx = -1; for (var i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t0 && t < CAPS[i].t1) { idx = i; break; }
    if (idx !== capIdx) {
      capIdx = idx;
      if (idx < 0) { capEl.innerHTML = ''; } else capEl.innerHTML = CAPS[idx].ws.map(function (w) { return '<span>' + w.w + '</span>'; }).join(' ');
    }
    if (idx < 0) { capEl.style.opacity = 0; return; }
    var C = CAPS[idx], kids = capEl.children;
    for (var j = 0; j < C.ws.length; j++) { var nxt = j + 1 < C.ws.length ? C.ws[j + 1].t0 : C.t1; kids[j].className = (t >= C.ws[j].t0 && t < nxt) ? 'cur' : ''; }
    capEl.style.opacity = ease(cl((t - C.t0) / .12)) * (1 - ease(cl((t - (C.t1 - .12)) / .12)));
  }

  /* ---------- render ---------- */
  function fit() { var w = view.clientWidth, h = view.clientHeight; if (!w || !h) return; stage.style.transform = 'scale(' + Math.min(w / 1920, h / 1080) + ')'; }
  var lk1 = $('#lk1'), lk2 = $('#lk2');
  function render(t) {
    var col = tone(t), cs = Math.round(col[0]) + ',' + Math.round(col[1]) + ',' + Math.round(col[2]), pl = pulse(t);
    els.forEach(function (o) {
      var el = o.el, span = o.bg ? 1.1 : .7;
      var x = cl((t - o.a) / span), p = o.bk && !o.bg ? back(x) : ease(x), q = ease(cl((t - o.b) / (o.bg ? 1.1 : .5)));
      var op = ease(x) * (1 - q);
      var dk = 0; if (o.dim !== null) { dk = ease(cl((t - o.dim) / .6)); op *= 1 - (1 - o.dimTo) * dk; }
      if (o.shock) { var k = cl((t - o.a) / 1.1); el.style.opacity = t < o.a ? 0 : ((1 - k) * .9).toFixed(3); el.style.transform = 'scale(' + (.12 + k * 3.1).toFixed(3) + ')'; return; }
      if (o.hh !== null) { el.style.opacity = (1 - q).toFixed(3); el.style.height = (o.hh * ease(cl((t - o.a) / .8))).toFixed(1) + 'px'; return; }
      el.style.opacity = op.toFixed(3);
      if (o.w !== null) { el.style.width = (o.w * ease(cl((t - o.a) / .42))).toFixed(1) + '%'; return; }
      if (o.scan !== null) { el.style.top = (110 + 400 * ((((t - o.a) / 1.7) % 1 + 1) % 1)).toFixed(1) + 'px'; return; }
      if (o.orb !== null) {
        var ang = (o.orb + t * 38) * Math.PI / 180, rr = o.r / 1;
        el.style.transform = 'translate(calc(-50% + ' + (Math.cos(ang) * rr).toFixed(1) + 'px),calc(-50% + ' + (Math.sin(ang) * rr * .86).toFixed(1) + 'px))'; return;
      }
      if (o.bg) { if (o.z) { var zk = cl((t - o.z[2]) / (o.z[3] - o.z[2])); el.style.transform = 'scale(' + (o.z[0] + (o.z[1] - o.z[0]) * zk).toFixed(4) + ')'; } return; }
      var ty = (1 - p) * o.y - q * 18, sc = 1 - (1 - p) * o.s + (o.beat ? o.beat * pl : 0);
      if (o.pulse) sc *= 1 + .035 * Math.sin((t - o.a) * 6.5) * ease(cl((t - o.a - .5) / .5));
      el.style.transform = 'translateY(' + ty.toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';
      var fb = (o.bl ? (1 - ease(x)) * o.bl : 0) + dk * 5; el.style.filter = fb > .05 ? 'blur(' + fb.toFixed(1) + 'px)' : '';
    });
    drawFx(t, col); drawRing(t, col); drawCaps(t);
    // light leaks
    lk1.style.transform = 'translate(' + (260 + 760 * Math.sin(t * .23)).toFixed(0) + 'px,' + (-250 + 300 * Math.cos(t * .17)).toFixed(0) + 'px)';
    lk2.style.transform = 'translate(' + (900 + 700 * Math.sin(t * .19 + 2)).toFixed(0) + 'px,' + (120 + 320 * Math.cos(t * .21 + 1)).toFixed(0) + 'px)';
    lk1.style.background = 'radial-gradient(circle,rgba(' + cs + ',.42),transparent 62%)'; lk2.style.background = 'radial-gradient(circle,rgba(' + cs + ',.30),transparent 62%)';
    lk1.style.opacity = (.55 + .25 * envAt(t)).toFixed(3); lk2.style.opacity = .5;
    // camera beat + impact flash + wipes + grain
    world.style.transform = 'scale(' + (1 + .009 * pl).toFixed(4) + ')';
    flash.style.opacity = (flashAt(t) * .42).toFixed(3);
    var wo = 0, wx = -900; WIPES.forEach(function (w) { var k = (t - (w - .3)) / .85; if (k > 0 && k < 1) { wx = -900 + k * 3200; wo = Math.sin(k * 3.1416); } });
    wipe.style.opacity = wo.toFixed(3); wipe.style.transform = 'translateX(' + wx.toFixed(0) + 'px) skewX(-14deg)';
    grain.style.transform = 'translate(' + (-((Math.floor(t * 24) * 37) % 40)) + 'px,' + (-((Math.floor(t * 24) * 61) % 40)) + 'px)';
    var f0 = 1 - ease(cl(t / .7)), f1 = ease(cl((t - (DUR - 1.1)) / 1));
    black.style.opacity = Math.max(f0, f1).toFixed(3);
  }

  /* ---------- player ---------- */
  var now = 0, playing = false, last = 0, bar = $('#bar'), time = $('#time'), pp = $('#pp'), snd = $('#snd');
  function mm(s) { return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2); }
  function seek(t) { now = Math.max(0, Math.min(DUR, t)); render(now); bar.value = Math.round(now * 10); time.textContent = mm(now) + ' / ' + mm(DUR); }
  function setPP() { pp.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
  function setSnd() { snd.textContent = aud.muted ? 'Sound off' : 'Sound on'; snd.setAttribute('aria-label', aud.muted ? 'Turn sound on' : 'Turn sound off'); }
  function startAudio() {
    if (RENDER) return;
    try {
      aud.currentTime = now; var pr = aud.play();
      if (pr && pr.catch) pr.catch(function () { aud.muted = true; setSnd(); snd.classList.add('hint'); try { aud.play().catch(function () {}); } catch (e) {} });
    } catch (e) {}
  }
  function loop(ts) {
    if (!playing) return;
    var dt = (ts - last) / 1000; last = ts;
    if (!RENDER && !aud.paused && !aud.ended && aud.readyState >= 3) seek(aud.currentTime); else seek(now + dt);
    if (now >= DUR - .02) { playing = false; setPP(); try { aud.pause(); } catch (e) {} return; }
    requestAnimationFrame(loop);
  }
  function play() { if (now >= DUR - .05) seek(0); playing = true; last = performance.now(); setPP(); startAudio(); requestAnimationFrame(loop); }
  function pause() { playing = false; setPP(); try { aud.pause(); } catch (e) {} }
  pp.addEventListener('click', function () { playing ? pause() : play(); });
  stage.addEventListener('click', function () { playing ? pause() : play(); });
  $('#rp').addEventListener('click', function () { seek(0); play(); });
  snd.addEventListener('click', function () { aud.muted = !aud.muted; snd.classList.remove('hint'); setSnd(); if (playing && aud.paused) startAudio(); });
  bar.addEventListener('input', function () { seek(bar.value / 10); if (!RENDER) { try { aud.currentTime = now; } catch (e) {} } });
  addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); } });
  addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(view);
  window.film = { seek: function (t) { seek(t); if (!RENDER) { try { aud.currentTime = now; } catch (e) {} } }, play: play, pause: pause, duration: DUR };
  setSnd(); fit(); seek(0);
  if (AUTO && !RENDER) play();
})();
</script>
</body>
</html>
